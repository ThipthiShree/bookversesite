<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookVerse - Premium Literary Experience</title>

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --accent: #f97316;
            --success: #22c55e;

            --bg-primary: #f3f4f6;
            --bg-secondary: #ffffff;
            --bg-elevated: #ffffff;

            --text-primary: #020617;
            --text-secondary: #6b7280;

            --border: #e5e7eb;

            --shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
            --radius: 16px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --primary: #60a5fa;
            --primary-dark: #3b82f6;
            --accent: #fb923c;
            --success: #4ade80;

            --bg-primary: #020617;
            --bg-secondary: #020617;
            --bg-elevated: #020617;

            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;

            --border: #111827;

            --shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 55%),
                radial-gradient(circle at top right, rgba(248, 113, 113, 0.14), transparent 60%),
                var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Auth */
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .auth-card {
            background: linear-gradient(135deg, rgba(15,23,42,0.96), rgba(15,23,42,0.98));
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(15,23,42,0.85);
            max-width: 980px;
            width: 100%;
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            overflow: hidden;
            color: #e5e7eb;
        }

        .auth-visual {
            position: relative;
            padding: 2.5rem;
            background:
              radial-gradient(circle at top left, rgba(59,130,246,0.35), transparent 60%),
              radial-gradient(circle at bottom right, rgba(249,115,22,0.25), transparent 55%);
        }

        .auth-logo {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .auth-logo span {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 600;
            border: 1px solid rgba(148,163,184,0.5);
        }

        .auth-title {
            font-size: 2.3rem;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
            font-weight: 700;
        }

        .auth-subtitle {
            color: #9ca3af;
            font-size: 0.98rem;
        }

        .auth-metrics {
            display: flex;
            gap: 1.5rem;
            margin-top: 2.5rem;
        }

        .auth-metric {
            padding: 0.7rem 1rem;
            border-radius: 999px;
            border: 1px solid rgba(148,163,184,0.4);
            background: rgba(15,23,42,0.6);
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .auth-metric strong {
            font-size: 1rem;
        }

        .auth-review {
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(148,163,184,0.35);
            display: flex;
            align-items: center;
            gap: 0.9rem;
            font-size: 0.9rem;
            color: #9ca3af;
        }

        .auth-avatar {
            width: 42px;
            height: 42px;
            border-radius: 999px;
            background: linear-gradient(135deg, #34d399, #22c55e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #022c22;
        }

        .auth-form {
            background: var(--bg-secondary);
            position: relative;
            padding: 2.5rem 2.25rem;
        }

        .auth-form-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .auth-badge {
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(37,99,235,0.08);
            color: var(--primary);
            border: 1px solid rgba(37,99,235,0.35);
        }

        .auth-toggle {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .auth-toggle button {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
        }

        .auth-field {
            margin-bottom: 1rem;
        }

        .auth-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }

        .auth-input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(15,23,42,0.02);
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }

        .auth-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 1px rgba(37,99,235,0.5);
        }

        .auth-checkbox {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.83rem;
            color: var(--text-secondary);
        }

        .auth-submit {
            margin-top: 1.25rem;
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            box-shadow: 0 14px 30px rgba(37,99,235,0.55);
            transition: var(--transition);
        }

        .auth-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 40px rgba(37,99,235,0.7);
        }

        .auth-separator {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin: 1.25rem 0;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .auth-separator span {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .auth-socials {
            display: flex;
            gap: 0.7rem;
        }

        .auth-social-btn {
            flex: 1;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(15,23,42,0.01);
            padding: 0.65rem 0.8rem;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .auth-helper {
            margin-top: 1rem;
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        /* Header */
        .header {
            backdrop-filter: blur(18px);
            background: color-mix(in srgb, var(--bg-secondary) 88%, transparent);
            border-bottom: 1px solid rgba(148,163,184,0.35);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 0;
            gap: 1rem;
        }

        .logo-main {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .logo-pill {
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.65rem;
            border: 1px solid rgba(148,163,184,0.7);
            color: var(--text-secondary);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 0.9rem;
        }

        .search-container {
            position: relative;
            flex: 1;
            max-width: 450px;
        }

        .search-input {
            width: 100%;
            padding: 0.7rem 0.9rem 0.7rem 2.4rem;
            border-radius: 999px;
            border: 1px solid rgba(148,163,184,0.6);
            background: color-mix(in srgb, var(--bg-primary) 80%, rgba(15,23,42,0.06));
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 1px rgba(37,99,235,0.6);
            background: var(--bg-secondary);
        }

        .search-icon {
            position: absolute;
            top: 50%;
            left: 0.9rem;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 999px;
            border: 1px solid rgba(148,163,184,0.7);
            background: color-mix(in srgb, var(--bg-primary) 75%, rgba(15,23,42,0.12));
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            backdrop-filter: blur(8px);
            transition: var(--transition);
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px);
        }

        .btn-secondary {
            border: 1px solid rgba(148,163,184,0.7);
            border-radius: 999px;
            padding: 0.45rem 0.9rem;
            background: color-mix(in srgb, var(--bg-secondary) 85%, transparent);
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .user-chip {
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            background: color-mix(in srgb, rgba(22,163,74,0.15), var(--bg-secondary) 70%);
            border: 1px solid rgba(34,197,94,0.4);
            font-size: 0.78rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
        }

        .user-avatar-sm {
            width: 24px;
            height: 24px;
            border-radius: 999px;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: #022c22;
            font-weight: 700;
        }

        .cart-badge {
            width: 26px;
            height: 26px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0.6rem;
            margin: 1.4rem 0 1.1rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 0.45rem 0.75rem;
            border-radius: 999px;
            border: 1px solid transparent;
            font-size: 0.78rem;
            cursor: pointer;
            background: transparent;
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: color-mix(in srgb, var(--primary) 90%, #000 10%);
            color: #eff6ff;
            border-color: transparent;
            box-shadow: 0 10px 24px rgba(37,99,235,0.55);
        }

        /* Hero */
        .hero {
            margin-top: 1.6rem;
            border-radius: 24px;
            padding: 2.4rem 2.3rem;
            background:
                radial-gradient(circle at top left, rgba(56,189,248,0.26), transparent 45%),
                radial-gradient(circle at bottom right, rgba(234,179,8,0.18), transparent 55%),
                linear-gradient(135deg, #0f172a, #020617);
            color: #e5e7eb;
            box-shadow: 0 28px 80px rgba(15,23,42,0.9);
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 2.3rem;
            overflow: hidden;
            position: relative;
        }

        .hero-left h1 {
            font-size: clamp(2.1rem, 3.1vw, 2.7rem);
            margin-bottom: 0.6rem;
        }

        .hero-left p {
            color: #9ca3af;
            font-size: 0.98rem;
            max-width: 460px;
        }

        .hero-cards-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0,1fr));
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .hero-mini-card {
            background: rgba(15,23,42,0.9);
            border-radius: 14px;
            border: 1px solid rgba(148,163,184,0.4);
            padding: 0.5rem 0.7rem;
            font-size: 0.72rem;
        }

        .hero-cover-stack {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-cover-stack img {
            width: 100%;
            max-width: 260px;
            border-radius: 20px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.9);
            transform: rotate(-4deg);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .hero-cover-stack img:hover {
            transform: rotate(-1deg) translateY(-4px) scale(1.02);
            box-shadow: 0 30px 80px rgba(0,0,0,1);
        }

        .hero-pill {
            position: absolute;
            top: 58%;
            left: 62%;
            transform: translate(-50%, -50%);
            padding: 0.55rem 0.9rem;
            background: rgba(15,23,42,0.9);
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            border: 1px solid rgba(148,163,184,0.7);
        }

        /* Layout */
        .main-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.8fr) minmax(260px, 0.95fr);
            gap: 1.8rem;
            margin-top: 2.4rem;
        }

        .content-area {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Book Grid + hover */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 1.3rem;
        }

        .book-item {
            background: color-mix(in srgb, var(--bg-elevated) 90%, rgba(15,23,42,0.06));
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid rgba(148,163,184,0.4);
            display: flex;
            flex-direction: column;
            min-height: 340px;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .book-item:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 24px 60px rgba(15,23,42,0.5);
            border-color: rgba(59,130,246,0.7);
        }

        .book-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            transition: transform 0.35s ease;
        }

        .book-item:hover .book-image {
            transform: scale(1.08) rotate(-1deg);
        }

        .book-info {
            padding: 0.9rem 1rem 1rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            flex: 1;
        }

        .book-title {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .book-author {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .book-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-top: 0.25rem;
        }

        .badge {
            padding: 0.15rem 0.45rem;
            border-radius: 999px;
            border: 1px solid rgba(148,163,184,0.6);
            font-size: 0.7rem;
        }

        .book-footer {
            display: flex;
            align-items: center;
            margin-top: 0.6rem;
            gap: 0.45rem;
        }

        .price {
            font-weight: 700;
            color: var(--accent);
            font-size: 0.95rem;
        }

        .btn-primary {
            border-radius: 999px;
            border: none;
            padding: 0.35rem 0.8rem;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            cursor: pointer;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #eff6ff;
            box-shadow: 0 10px 22px rgba(37,99,235,0.6);
        }

        .btn-primary:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
        }

        .stars {
            color: #facc15;
            font-size: 0.7rem;
        }

        /* Sidebar */
        .sidebar {
            position: sticky;
            top: 88px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .sidebar-section {
            background: color-mix(in srgb, var(--bg-elevated) 90%, rgba(15,23,42,0.05));
            border-radius: 18px;
            padding: 1.1rem 1.1rem 1.2rem;
            border: 1px solid rgba(148,163,184,0.5);
            box-shadow: var(--shadow);
        }

        .sidebar-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .sidebar-sub {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-bottom: 0.7rem;
        }

        .filter-group {
            margin-bottom: 0.7rem;
        }

        .filter-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        .filter-input {
            width: 100%;
            padding: 0.5rem 0.6rem;
            border-radius: 10px;
            border: 1px solid rgba(148,163,184,0.6);
            background: color-mix(in srgb, var(--bg-secondary) 90%, rgba(15,23,42,0.04));
            color: var(--text-primary);
            font-size: 0.8rem;
        }

        .cart-item {
            display: flex;
            gap: 0.6rem;
            padding: 0.5rem 0;
            border-bottom: 1px dashed rgba(148,163,184,0.5);
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-image {
            width: 38px;
            height: 52px;
            border-radius: 8px;
            object-fit: cover;
        }

        .cart-details {
            flex: 1;
        }

        .cart-details h4 {
            font-size: 0.78rem;
            margin-bottom: 0.15rem;
        }

        .cart-price {
            font-size: 0.78rem;
            color: var(--accent);
            font-weight: 600;
        }

        /* Media */
        .media-container {
            background: color-mix(in srgb, var(--bg-elevated) 90%, rgba(15,23,42,0.05));
            border-radius: 18px;
            padding: 1rem 1.1rem 1.2rem;
            border: 1px solid rgba(148,163,184,0.5);
            box-shadow: var(--shadow);
        }

        .media-container h3 {
            font-size: 1rem;
            margin-bottom: 0.7rem;
        }

        audio,
        video {
            width: 100%;
            border-radius: 12px;
            outline: none;
        }

        /* Profile & History */
        .profile-section {
            margin-top: 1rem;
            background: color-mix(in srgb, var(--bg-elevated) 90%, rgba(15,23,42,0.05));
            border-radius: 18px;
            padding: 1rem 1.1rem 1.2rem;
            border: 1px solid rgba(148,163,184,0.5);
            box-shadow: var(--shadow);
        }

        .profile-header {
            display: flex;
            gap: 0.7rem;
            align-items: center;
            margin-bottom: 0.6rem;
        }

        .profile-avatar {
            width: 40px;
            height: 40px;
            border-radius: 999px;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #022c22;
            font-weight: 700;
        }

        .profile-meta {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .history-list {
            margin-top: 0.4rem;
            max-height: 140px;
            overflow: auto;
            padding-right: 0.2rem;
        }

        .history-item {
            font-size: 0.78rem;
            padding: 0.25rem 0;
            border-bottom: 1px dashed rgba(148,163,184,0.4);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        /* Follow Authors */
        .author-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 0;
            border-bottom: 1px dashed rgba(148,163,184,0.5);
            font-size: 0.85rem;
        }

        .author-card:last-child {
            border-bottom: none;
        }

        .follow-btn {
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
            border: 1px solid rgba(148,163,184,0.7);
            background: color-mix(in srgb, var(--bg-secondary) 90%, rgba(15,23,42,0.05));
            font-size: 0.75rem;
            cursor: pointer;
        }

        .follow-btn.following {
            background: linear-gradient(135deg, var(--success), #16a34a);
            border-color: transparent;
            color: #022c22;
            box-shadow: 0 10px 20px rgba(34,197,94,0.5);
        }

        /* Shopping Grab Now bar */
        .grab-bar {

const ThemeToggle = ({ onToggle }) => {
    const [mounted, setMounted] = useState(false);

    useEffect(() => setMounted(true), []);

    const toggleTheme = () => {
        const current = document.documentElement.getAttribute("data-theme") || "light";
        const next = current === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
        if (onToggle) onToggle(next);
    };

    if (!mounted) return null;

    const isDark = (document.documentElement.getAttribute("data-theme") || "light") === "dark";

    return (
        <button className="theme-toggle" onClick={toggleTheme} title="Toggle theme">
            <i className={isDark ? "fas fa-sun" : "fas fa-moon"}></i>
        </button>
    );
};

      onCheckoutClick={() => setShowCheckout(true)}
    />
  </div>
)}

                            onCheckoutClick={() => setShowCheckout(true)}

                        <Sidebar
                            filters={filters}
                            onFilterChange={handleFilterChange}
                            cart={cart}
                            onRemove={removeFromCart}
                            profile={profile}
                            history={history}
                            onCheckoutClick={() => setShowCheckout(true)}

                            cart={cart}
                            onRemove={removeFromCart}
                            profile={profile}
                            history={history}
                            onCheckoutClick={() => setShowCheckout(true)}
                        />
                    </div>
                )}

                {activeTab === "tracking" && (

                        <Sidebar
                            filters={filters}
                            onFilterChange={handleFilterChange}
                            cart={cart}
